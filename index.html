<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="/manifest.webmanifest"><title>Plan Navigator</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--pn:#fffffff0;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#f1f5f9;--pn:#1e293bf0}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.bar{position:fixed;left:8px;background:var(--pn);border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px #0004}
#top{right:8px;top:calc(8px + env(safe-area-inset-top))}
#bot{right:150px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px}
button{min-height:44px;min-width:44px;border:0;border-radius:10px;padding:0 12px;background:var(--ac);color:#fff;font:inherit}
button.g{background:#64748b}#mark{background:#16a34a;font-weight:700}
#msg{font-size:13px;opacity:.85}
</style></head><body>
<canvas id="c"></canvas>
<div class="bar" id="top"><b>Plan Navigator</b><div id="msg">Upload › Start sensors › Calibrate › Pin › Walk</div></div>
<div class="bar" id="bot">
<button id="bUp">Upload</button><button id="bSen">Start</button><button id="bCal" class="g">Calibrate</button>
<button id="bPin" class="g">Pin me</button><button id="mark">Mark</button><button id="bFol" class="g">Follow</button>
<button id="bTr" class="g">Trail</button><button id="bClr" class="g">Clear</button><button id="bExp" class="g">Export</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
"use strict";
const $=s=>document.querySelector(s),cv=$("#c"),cx=cv.getContext("2d"),msg=t=>$("#msg").textContent=t;
let S={spp:0,off:0,marks:[],trail:[],pos:null,trailOn:true},img=null,V={x:0,y:0,k:1},mode="",A=null,hs=0,hc=0,cs=0,follow=true,head=0,since=0,hasSens=false;
/* storage */
const db=new Promise(r=>{try{const q=indexedDB.open("plannav",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const idb=async(m,k,v)=>{try{const d=await db;if(!d)return;return await new Promise(r=>{const o=d.transaction("k",m==="get"?"readonly":"readwrite").objectStore("k"),q=m==="get"?o.get(k):o.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}};
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(()=>idb("set","state",S),400)};
/* image */
function load(b){const i=new Image();i.onload=()=>{img=i;fit();draw()};i.src=URL.createObjectURL(b)}
function fit(){const k=Math.min(innerWidth/img.width,innerHeight/img.height)*.95;V={k,x:(innerWidth-img.width*k)/2,y:(innerHeight-img.height*k)/2}}
$("#bUp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;S={...S,spp:0,off:0,marks:[],trail:[],pos:null};idb("set","img",f);load(f);save();msg("Now tap Start, then Calibrate")};
/* canvas */
const size=()=>{const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;draw()};addEventListener("resize",size);
const w2s=p=>[p[0]*V.k+V.x,p[1]*V.k+V.y],s2w=p=>[(p[0]-V.x)/V.k,(p[1]-V.y)/V.k];
let raf=0;const draw=()=>{if(!raf)raf=requestAnimationFrame(render)};
function dot(p,r,c){const s=w2s(p);cx.fillStyle=c;cx.beginPath();cx.arc(s[0],s[1],r,0,7);cx.fill()}
function render(){raf=0;const d=devicePixelRatio||1;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,innerWidth,innerHeight);if(!img)return;
cx.drawImage(img,V.x,V.y,img.width*V.k,img.height*V.k);
if(S.trailOn&&S.trail.length>1){const n=S.trail.length;for(let i=1;i<n;i++){cx.strokeStyle=`rgba(37,99,235,${.05+.25*i/n})`;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(...w2s(S.trail[i-1]));cx.lineTo(...w2s(S.trail[i]));cx.stroke()}}
S.marks.forEach(m=>dot(m.p,6,"#dc2626"));
if(A)dot(A,7,"#f59e0b");
if(S.pos){const s=w2s(S.pos),h=(head+S.off-90)*Math.PI/180,rr=Math.min(80,10+since*.4);
dot(S.pos,rr,"#2563eb22");cx.fillStyle="#2563eb55";cx.beginPath();cx.moveTo(...s);cx.arc(s[0],s[1],34,h-.5,h+.5);cx.fill();
cx.strokeStyle="#fff";cx.lineWidth=3;dot(S.pos,8,"#2563eb");cx.beginPath();cx.arc(s[0],s[1],8,0,7);cx.stroke()}}
/* gestures */
const P=new Map();let g=null,down=null,lastTap=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);down={t:Date.now(),x:e.clientX,y:e.clientY,mv:0};g=pg()});
function pg(){const a=[...P.values()];if(a.length<2)return{c:a[0],d:0,V:{...V}};return{c:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],d:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),V:{...V}}}
cv.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);if(down)down.mv=Math.max(down.mv,Math.hypot(e.clientX-down.x,e.clientY-down.y));
const n=pg();follow=false;if(P.size>=2&&g.d){const k=Math.max(.05,Math.min(12,g.V.k*n.d/g.d));V.k=k;V.x=n.c[0]-(g.c[0]-g.V.x)*k/g.V.k;V.y=n.c[1]-(g.c[1]-g.V.y)*k/g.V.k}else if(g.c){V.x=g.V.x+n.c[0]-g.c[0];V.y=g.V.y+n.c[1]-g.c[1]}draw()});
cv.addEventListener("pointerup",e=>{if(!P.has(e.pointerId))return;const was=P.size===1&&down&&down.mv<8&&Date.now()-down.t<300;P.delete(e.pointerId);g=pg();if(was)tap([e.clientX,e.clientY])});
cv.addEventListener("pointercancel",e=>P.delete(e.pointerId));
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt([e.clientX,e.clientY],Math.exp(-e.deltaY*.0015))},{passive:false});
function zoomAt(c,f){const k=Math.max(.05,Math.min(12,V.k*f));V.x=c[0]-(c[0]-V.x)*k/V.k;V.y=c[1]-(c[1]-V.y)*k/V.k;V.k=k;draw()}
function tap(sp){if(!img)return;const now=Date.now();if(now-lastTap<300&&!mode){zoomAt(sp,2);lastTap=0;return}lastTap=now;const w=s2w(sp);
if(mode==="pinA"){A=w;S.pos=w;S.trail=[w];cs=0;hs=hc=0;mode="walk";msg("Walk to another spot (10+ steps), then tap that exact spot");draw();return}
if(mode==="walk")return finishCal(w);
if(mode==="pin"){S.pos=w;since=0;S.trail.push(w);mode="";save();msg(S.spp?"Pinned. Walk!":"Pinned. Now Calibrate");draw();return}
const i=S.marks.findIndex(m=>{const s=w2s(m.p);return Math.hypot(s[0]-sp[0],s[1]-sp[1])<22});
if(i>=0){const m=S.marks[i];if(confirm((m.note?m.note+"\n":"")+m.t+"\nDelete this mark?")){S.marks.splice(i,1);save();draw()}}}
function finishCal(w){const d=Math.hypot(w[0]-A[0],w[1]-A[1]);if(cs<8)return msg("Only "+cs+" steps counted. Walk further, then tap your spot");
S.spp=d/cs;const mh=Math.atan2(hs,hc)*180/Math.PI,ma=Math.atan2(w[0]-A[0],-(w[1]-A[1]))*180/Math.PI;S.off=ma-mh;S.pos=w;S.trail.push(w);since=0;A=null;mode="";save();msg("Calibrated ("+cs+" steps). Walk!");draw()}
/* buttons */
$("#bCal").onclick=()=>{if(!img)return msg("Upload a plan first");if(!hasSens)return msg("Tap Start first");mode="pinA";A=null;msg("Tap your exact position on the plan")};
$("#bPin").onclick=()=>{if(!img)return msg("Upload a plan first");mode="pin";msg("Tap where you are")};
$("#bFol").onclick=()=>{follow=true;if(S.pos)centerOn();draw()};
$("#bTr").onclick=()=>{S.trailOn=!S.trailOn;save();draw()};
$("#bClr").onclick=()=>{S.trail=S.pos?[S.pos]:[];save();draw()};
function centerOn(){const s=w2s(S.pos);V.x+=innerWidth/2-s[0];V.y+=innerHeight/2-s[1]}
$("#mark").onclick=()=>{if(!S.pos)return msg("Pin your position first");const note=prompt("Note (optional)")||"";S.marks.push({p:[...S.pos],t:new Date().toISOString(),note});save();draw();msg("Marked ("+S.marks.length+")")};
$("#bExp").onclick=()=>{const dl=(n,t,m)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
dl("marks.json",JSON.stringify(S.marks,null,1),"application/json");
dl("marks.csv","time,x_px,y_px,note\n"+S.marks.map(m=>[m.t,m.p[0].toFixed(1),m.p[1].toFixed(1),'"'+m.note.replace(/"/g,'""')+'"'].join(",")).join("\n"),"text/csv")};
/* sensors */
let lp=9.8,base=9.8,last=0,prev=0,pprev=0,wl=null;
$("#bSen").onclick=async()=>{try{const rs=await Promise.all([DeviceMotionEvent,DeviceOrientationEvent].map(C=>C&&C.requestPermission?C.requestPermission():"granted"));if(rs.includes("denied"))throw 0;
if(!("ondevicemotion" in window))throw 0;addEventListener("devicemotion",onMotion);addEventListener("deviceorientationabsolute",onOri);addEventListener("deviceorientation",onOri);hasSens=true;
try{wl=await navigator.wakeLock.request("screen")}catch{}msg("Sensors on. Now Calibrate")}catch{msg("Sensors unavailable or denied (needs a phone + HTTPS)")}};
function onOri(e){let h=e.webkitCompassHeading;if(h==null){if(e.type==="deviceorientation"&&e.absolute===false&&"ondeviceorientationabsolute" in window)return;if(e.alpha==null)return;h=360-e.alpha}
head=(head+.15*(((h-head+540)%360)-180)+360)%360;draw()}
function onMotion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const m=Math.hypot(a.x,a.y,a.z);lp+=.3*(m-lp);base+=.02*(m-base);const dev=lp-base,t=e.timeStamp||Date.now();
if(prev>pprev&&prev>=dev&&prev>.5&&t-last>280){last=t;step()}pprev=prev;prev=dev}
function step(){if(mode==="walk"){cs++;hs+=Math.sin(head*Math.PI/180);hc+=Math.cos(head*Math.PI/180);msg("Steps: "+cs+" — tap your spot when you stop");return}
if(!S.spp||!S.pos||mode)return;const h=(head+S.off)*Math.PI/180,n=[S.pos[0]+Math.sin(h)*S.spp,S.pos[1]-Math.cos(h)*S.spp];
if(n[0]<0||n[1]<0||n[0]>img.width||n[1]>img.height)return;S.pos=n;since++;S.trail.push(n);if(S.trail.length>3000)S.trail.shift();if(follow)centerOn();save();draw();if(since>60)msg("Drifting — tap Pin me to re-pin")}
/* boot */
(async()=>{size();const s=await idb("get","state");if(s)S={...S,...s};const b=await idb("get","img");if(b)load(b);if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{})})();
</script></body></html>
